{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tote labels · Sprout Tote Co.</title>
  <style>
    /* Sized for 2" x 2" square labels, 3 across x 5 down on US Letter.
       Adjust --label and the page margins to match your label sheet. */
    :root { --label: 2in; --col-gap: 0.25in; }
    @page { size: letter; margin: 0.5in 0.375in; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #000; background: #fff; }
    .bar { padding: 12px 16px; border-bottom: 1px solid #ccc; font-size: 14px; }
    .sheet { display: grid; grid-template-columns: repeat(3, var(--label)); column-gap: var(--col-gap);
             justify-content: center; padding: 0.25in 0; }
    .label { width: var(--label); height: var(--label); border: 1px dashed #bbb; box-sizing: border-box;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             break-inside: avoid; page-break-inside: avoid; }
    .label svg { width: 1.2in; height: 1.2in; }
    .code { font: 700 0.42in/1 "Courier New", monospace; letter-spacing: 0.06in; margin-top: 0.04in; }
    .domain { font-size: 0.11in; letter-spacing: 0.01in; }
    @media print { .bar { display: none; } .sheet { padding: 0; } .label { border-color: transparent; } }
  </style>
</head>
<body>
  <div class="bar">{{ items|length }} label{{ items|length|pluralize }} ({{ copies }} per tote).
    <a href="javascript:window.print()">Print</a> ·
    Copies per tote: <a href="?{% if request.GET.codes %}codes={{ request.GET.codes }}&{% endif %}copies=1">1</a>
    <a href="?{% if request.GET.codes %}codes={{ request.GET.codes }}&{% endif %}copies=2">2</a> ·
    <a href="{% url 'ops_index' %}">Back</a></div>
  <div class="sheet">
    {% for item in items %}
      <div class="label">{{ item.svg }}<div class="code">{{ item.code }}</div><div class="domain">{{ domain }}</div></div>
    {% empty %}<p>No totes selected.</p>{% endfor %}
  </div>
</body>
</html>
