{% extends "rentals/base.html" %}
{% block title %}Find a tote · Sprout Tote Co.{% endblock %}
{% block content %}
<section class="card narrow-card">
  <h2>Type a tote code</h2>
  <p class="muted">It's the 3 large letters and numbers on the label, like K7Q.</p>
  <form method="get">
    <label for="id_code">Code</label>
    <input id="id_code" name="code" maxlength="8" autocapitalize="characters" autocomplete="off" required>
    <button type="submit">Open tote</button>
  </form>
</section>
{% endblock %}
