# Render Blueprint: the test copy of the site (staging) and its database.
# In Render: New > Blueprint, pick this repository and branch.
# Secrets marked "sync: false" are typed into Render's dashboard, never stored here.

databases:
  - name: sprout-staging-db
    plan: free            # free databases expire after 30 days; fine for testing
    databaseName: sprout
    user: sprout
    region: virginia

services:
  - type: web
    name: sprout-staging
    runtime: python
    plan: free            # sleeps when idle; first visit after a while takes ~1 minute
    region: virginia
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: sprout-staging-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: SITE_URL      # used for links in emails
        value: https://sprout-staging.onrender.com
      - key: TRUST_X_FORWARDED_FOR
        value: "1"
      - key: SITE_BANNER
        value: "Test site: bookings here aren't real. Use Stripe test card 4242 4242 4242 4242."
      - key: MAPS_BACKEND
        value: auto       # real Google lookups once GOOGLE_MAPS_API_KEY (server key) is set in Render
      # Google server key (Geocoding API only): typed into Render, never stored here.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        value: AIzaSyB82Fa5IGtJnh-shhZgHedCZmY-MTeVC7g   # public; Google limits it to our web addresses
      # Stripe test mode
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # First owner login (created on the first deploy)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: OWNER_EMAILS
        sync: false
      # Email: printed to Render's logs until POSTMARK_SERVER_TOKEN (secret) is
      # added in Render's dashboard; then it's sent through Postmark.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: "Sprout Tote Co. <hello@sprouttoteco.com>"
